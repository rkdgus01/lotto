# 당첨번호 수집 + GitHub Pages 배포
#  - main 에 push 하면: 빌드 후 배포
#  - 매주 토 21:30 / 일 09:00 (KST): 새 회차 수집 → 있으면 커밋 → 빌드 후 배포
#  - Actions 탭에서 수동 실행(Run workflow)도 가능
name: collect-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 12 * * 6' # 토 21:30 KST
    - cron: '0 0 * * 0' # 일 09:00 KST (토요일에 실패했을 때 재시도)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 당첨번호 수집
        if: github.event_name != 'push'
        run: node scripts/fetch-draws.mjs

      - name: 새 회차가 있으면 커밋
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- public/data/draws.json; then
            echo "새 회차 없음"
            exit 0
          fi
          latest=$(node -e "const d=require('./public/data/draws.json').draws; console.log(d[d.length-1].round)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/draws.json
          git commit -m "당첨번호 갱신 (${latest}회)"
          git push

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
